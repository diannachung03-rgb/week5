<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>과일주스 만들기</title>

<style>
body {
    background: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px;
    margin: 0;
}

h1 {
    margin-bottom: 20px;
}

h2 {
    font-size: 1rem;
    margin: 12px 0 5px 0;
    color: #555;
}

.container {
    display: flex;
    gap: 40px;
    padding: 30px;
    align-items: flex-start;
}

.smoothieArea {
    width: 300px;
    height: 430px;
    display: flex;
    justify-content: center;
    align-items: flex-end;
}

#cup {
    position: relative;
    width: 180px;
    height: 260px;
    background: #e0f7fa;
    clip-path: polygon(10% 0%,90% 0%,78% 100%,22% 100%);
    overflow: hidden;
    transition: all 0.3s ease;
}

#syrup {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 0%;
    background: rgba(255,220,150,0.5);
}

#sticker {
    position: absolute;
    top: 10%;
    left: 50%;
    transform: translate(-50%,-50%);
    background: white;
    padding: 6px 14px;
    border-radius: 6px;
    font-weight: bold;
    display: none;
    z-index: 10;
}

.controls {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 260px;
}

.control-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

input[type="range"] {
    width: 100%;
    cursor: pointer;
}

input[type="text"] {
    padding: 6px;
    border: 1px solid #ddd;
    border-radius: 4px;
}

.fruit-btn-group {
    display: flex;
    gap: 5px;
}

button {
    padding: 8px;
    background: #eeeeee;
    color: dimgray;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
}

#fruitText {
    font-size: 14px;
    color: #777;
}

#sweetnessGroup {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

#resetBtn {
    position: fixed;
    top: 15px;
    right: 15px;
    padding: 5px 9px;
    font-size: 11px;
    background: #eeeeee;
    color: dimgray;
}
</style>
</head>

<body>

<button id="resetBtn">RESET</button>

<h1>🧃과일주스 만들기🧃</h1>

<div class="container">

    <div class="smoothieArea">
        <div id="cup">
            <div id="syrup"></div>
            <div id="sticker"></div>
        </div>
    </div>

    <div class="controls">

        <h2>컵 사이즈</h2>

        <div class="control-group">
            <input type="range" id="sizeRange" min="1" max="3" value="1">
        </div>

        <h2>과일 추가하기 (최대 2가지)</h2>

        <div class="fruit-btn-group">
            <button id="strawberryBtn" onclick="addFruit('딸기','#F7B6D2')">🍓 딸기</button>
            <button id="mangoBtn" onclick="addFruit('망고','#FFD0A3')">🥭 망고</button>
        </div>

        <div class="fruit-btn-group">
            <button id="blueberryBtn" onclick="addFruit('블루베리','#D5B8E8')">🫐 블루베리</button>
            <button id="kiwiBtn" onclick="addFruit('키위','#CBE8A3')">🥝 키위</button>
        </div>

        <p id="fruitText">과일을 선택해주세요.</p>

        <div id="sweetnessGroup">
            <h2>당도 조절</h2>

            <div class="control-group">
                <input type="range" id="sweetness" min="0" max="100" value="0">
            </div>
        </div>

        <h2>닉네임</h2>

        <div>
            <input type="text" id="nicknameInput" placeholder="닉네임 입력">
            <button id="addStickerBtn">추가</button>
        </div>

        <button id="makeSlushBtn">✨ 주스 만들기!</button>

    </div>
</div>

<script>

let fruit1 = "";
let fruit2 = "";
let name1 = "";
let name2 = "";

let cup = document.getElementById("cup");
let syrup = document.getElementById("syrup");
let fruitText = document.getElementById("fruitText");
let sizeRange = document.getElementById("sizeRange");
let sweetness = document.getElementById("sweetness");
let sweetnessGroup = document.getElementById("sweetnessGroup");
let nicknameInput = document.getElementById("nicknameInput");
let sticker = document.getElementById("sticker");

let strawberryBtn = document.getElementById("strawberryBtn");
let mangoBtn = document.getElementById("mangoBtn");
let blueberryBtn = document.getElementById("blueberryBtn");
let kiwiBtn = document.getElementById("kiwiBtn");

let resetBtn = document.getElementById("resetBtn");
let makeSlushBtn = document.getElementById("makeSlushBtn");
let addStickerBtn = document.getElementById("addStickerBtn");


sizeRange.oninput = function(){

    if(sizeRange.value == 1){
        cup.style.width = "180px";
        cup.style.height = "260px";
    }

    else if(sizeRange.value == 2){
        cup.style.width = "240px";
        cup.style.height = "320px";
    }

    else if(sizeRange.value == 3){
        cup.style.width = "300px";
        cup.style.height = "380px";
    }
};


sweetness.oninput = function(){
    syrup.style.height = sweetness.value + "%";
};


function updateCupColor(){

    if(fruit1 == ""){
        cup.style.background = "#e0f7fa";
    }

    else if(fruit2 == ""){
        cup.style.background = fruit1;
    }

    else if(
        (fruit1 == "#F7B6D2" && fruit2 == "#FFD0A3") ||
        (fruit1 == "#FFD0A3" && fruit2 == "#F7B6D2")
    ){
        cup.style.background = "#F8C5B8";
    }

    else if(
        (fruit1 == "#F7B6D2" && fruit2 == "#D5B8E8") ||
        (fruit1 == "#D5B8E8" && fruit2 == "#F7B6D2")
    ){
        cup.style.background = "#D9BCE0";
    }

    else if(
        (fruit1 == "#F7B6D2" && fruit2 == "#CBE8A3") ||
        (fruit1 == "#CBE8A3" && fruit2 == "#F7B6D2")
    ){
        cup.style.background = "#DCE2B5";
    }

    else if(
        (fruit1 == "#FFD0A3" && fruit2 == "#D5B8E8") ||
        (fruit1 == "#D5B8E8" && fruit2 == "#FFD0A3")
    ){
        cup.style.background = "#D8C2C5";
    }

    else if(
        (fruit1 == "#FFD0A3" && fruit2 == "#CBE8A3") ||
        (fruit1 == "#CBE8A3" && fruit2 == "#FFD0A3")
    ){
        cup.style.background = "#D8E0B8";
    }

    else if(
        (fruit1 == "#D5B8E8" && fruit2 == "#CBE8A3") ||
        (fruit1 == "#CBE8A3" && fruit2 == "#D5B8E8")
    ){
        cup.style.background = "#CFCDBE";
    }
}


function addFruit(name, color){

    if(fruit1 == color){
        fruit1 = fruit2;
        fruit2 = "";
        name1 = name2;
        name2 = "";
    }

    else if(fruit2 == color){
        fruit2 = "";
        name2 = "";
    }

    else if(fruit1 == ""){
        fruit1 = color;
        name1 = name;
    }

    else if(fruit2 == ""){
        fruit2 = color;
        name2 = name;
    }


    strawberryBtn.style.background = "#eeeeee";
    mangoBtn.style.background = "#eeeeee";
    blueberryBtn.style.background = "#eeeeee";
    kiwiBtn.style.background = "#eeeeee";


    if(fruit1 == "#F7B6D2" || fruit2 == "#F7B6D2"){
        strawberryBtn.style.background = "#F7B6D2";
    }

    if(fruit1 == "#FFD0A3" || fruit2 == "#FFD0A3"){
        mangoBtn.style.background = "#FFD0A3";
    }

    if(fruit1 == "#D5B8E8" || fruit2 == "#D5B8E8"){
        blueberryBtn.style.background = "#D5B8E8";
    }

    if(fruit1 == "#CBE8A3" || fruit2 == "#CBE8A3"){
        kiwiBtn.style.background = "#CBE8A3";
    }


    fruitText.innerHTML = "";

    if(name1 != ""){
        fruitText.innerHTML = name1;
    }

    if(name2 != ""){
        fruitText.innerHTML = fruitText.innerHTML + " + " + name2;
    }

    if(fruit1 == ""){
        fruitText.innerHTML = "과일을 선택해주세요.";
    }

    updateCupColor();
}


makeSlushBtn.onclick = function(){

    syrup.style.display = "none";

    if(fruit1 != "" && fruit2 == ""){
        cup.style.background =
            "linear-gradient(to top," + fruit1 + ",#ffffff)";
    }

    else if(fruit1 != "" && fruit2 != ""){
        cup.style.background =
            "linear-gradient(to top," + fruit1 + "," + fruit2 + ")";
    }
};


addStickerBtn.onclick = function(){

    sticker.innerHTML = nicknameInput.value;
    sticker.style.display = "block";
};


resetBtn.onclick = function(){

    sizeRange.value = 1;

    cup.style.width = "180px";
    cup.style.height = "260px";

    sweetness.value = 0;
    syrup.style.height = "0%";
    syrup.style.display = "block";

    fruit1 = "";
    fruit2 = "";
    name1 = "";
    name2 = "";

    fruitText.innerHTML = "과일을 선택해주세요.";

    cup.style.background = "#e0f7fa";

    nicknameInput.value = "";
    sticker.innerHTML = "";
    sticker.style.display = "none";

    strawberryBtn.style.background = "#eeeeee";
    mangoBtn.style.background = "#eeeeee";
    blueberryBtn.style.background = "#eeeeee";
    kiwiBtn.style.background = "#eeeeee";

    sweetnessGroup.style.display = "flex";
};

</script>

</body>
</html>
